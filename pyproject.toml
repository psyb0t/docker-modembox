[project]
name = "modembox"
version = "0.1.0"
description = "USB cellular modem gateway for SMS, voice and AT commands"
requires-python = ">=3.12"
dependencies = [
  "cryptography==46.0.5",
  "fastapi==0.136.1",
  "fastmcp==2.14.7",
  "pyserial==3.5",
  "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.3", "ruff==0.15.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["unit: tests with no modem or router"]

[tool.ruff]
line-length = 100

[tool.uv]
exclude-newer = "2026-11-13T00:00:00Z"
